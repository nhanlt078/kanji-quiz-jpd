<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanji Quiz</title>
  <style>
    :root { --ink:#192033; --muted:#667085; --accent:#e85635; --paper:#fffdf9; --line:#e7e1d8; --good:#16805a; --bad:#c63c3c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(135deg,#f9eee2,#eef3ef); }
    main { width:min(760px,calc(100% - 32px)); margin:40px auto; }
    header { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:20px; }
    h1 { margin:0; font-size:clamp(28px,5vw,42px); letter-spacing:-1px; } h1 span { color:var(--accent); }
    header p { margin:5px 0 0; color:var(--muted); }
    .score { text-align:right; font-weight:700; white-space:nowrap; }.score small { display:block; color:var(--muted); font-weight:500; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 14px 36px #5e493011; }
    .controls { display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap; } select,button { font:inherit; border-radius:10px; padding:10px 13px; border:1px solid var(--line); background:white; color:var(--ink); cursor:pointer; } button:hover:not(:disabled) { transform:translateY(-1px); } #next { background:var(--ink); color:white; border-color:var(--ink); margin-left:auto; }
    .label { color:var(--muted); font-size:14px; text-transform:uppercase; letter-spacing:.08em; } .kanji { font-size:clamp(72px,18vw,132px); text-align:center; line-height:1.2; margin:18px 0 28px; font-family:"Yu Mincho","Noto Serif JP",serif; }
    .options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }.option { text-align:left; font-size:20px; min-height:58px; transition:.15s; }.option b { color:var(--accent); margin-right:10px; font-size:14px; }.option:disabled { cursor:default; opacity:1; }.correct { background:#e2f4ed!important; border-color:var(--good)!important; color:#075a3b!important; }.wrong { background:#fce7e6!important; border-color:var(--bad)!important; color:#8d2424!important; }
    #result { margin-top:18px; padding:0 16px; max-height:0; overflow:hidden; background:#f4f1eb; border-radius:12px; transition:.25s; }.show { padding:15px 16px!important; max-height:180px!important; }.answer { font-size:26px; font-weight:750; }.meaning { color:var(--muted); margin:5px 0 0; }.message { margin:0 0 8px; font-weight:700; }.correct-text { color:var(--good); }.wrong-text { color:var(--bad); }
    footer { margin:18px 4px; color:var(--muted); font-size:13px; text-align:center; } kbd { padding:1px 5px; background:white; border:1px solid var(--line); border-radius:4px; }
    @media(max-width:520px) { main { margin:22px auto; } header { align-items:start; flex-direction:column; }.score{text-align:left}.panel{padding:18px}.options{grid-template-columns:1fr;} #next{margin-left:0;} }
  </style>
</head>
<body>
<main>
  <header><div><h1>Kanji <span>Quiz</span></h1><p>Chọn cách đọc Hiragana đúng cho Kanji.</p></div><div class="score"><span id="score">0 / 0</span><small>Đúng / Đã làm</small></div></header>
  <section class="panel">
    <div class="controls"><select id="unit" aria-label="Chọn unit"></select><button id="shuffle" type="button">Xáo trộn</button><button id="restart" type="button">↻ Làm lại</button><button id="next" type="button">Câu tiếp ›</button></div>
    <div class="label" id="progress">Câu hỏi</div><div class="kanji" id="kanji">東</div>
    <div class="options" id="options"></div>
    <div id="result" aria-live="polite"></div>
  </section>
  <footer>Phím <kbd>1</kbd>–<kbd>4</kbd> để chọn đáp án · <kbd>Enter</kbd> để qua câu tiếp theo</footer>
</main>

const words=raw.split('\n').map(line=>{const [unit,kanji,hira,meaning]=line.split('|');return{unit,kanji,hira,meaning}});
const $=s=>document.querySelector(s), unit=$('#unit'), options=$('#options'), result=$('#result'); let pool=[], current, answered=false, right=0, total=0;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function setPool(){ const chosen=unit.value; pool=shuffle(words.filter(w=>chosen==='all'||w.unit===chosen)); next(); }
function next(){ if(!pool.length){ const chosen=unit.value; pool=shuffle(words.filter(w=>chosen==='all'||w.unit===chosen)); } current=pool.pop(); answered=false; result.className=''; result.innerHTML=''; $('#kanji').textContent=current.kanji; $('#progress').textContent=`Unit ${current.unit} · còn ${pool.length+1} từ`; const distractors=shuffle([...new Set(words.filter(w=>w.hira!==current.hira).map(w=>w.hira))]).slice(0,3); const answers=shuffle([current.hira,...distractors]); options.innerHTML=''; answers.forEach((answer,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<b>${'ABCD'[i]}</b>${answer}`;b.onclick=()=>choose(b,answer);options.append(b)}); }
function choose(button, answer){ if(answered)return; answered=true; const correct=answer===current.hira; total++; if(correct)right++; [...options.children].forEach(b=>{b.disabled=true;if(b.textContent.trim().endsWith(current.hira))b.classList.add('correct')}); if(!correct)button.classList.add('wrong'); result.className='show'; result.innerHTML=`<p class="message ${correct?'correct-text':'wrong-text'}">${correct?'✓ Chính xác!':'✕ Chưa đúng.'}</p><div class="answer">${current.kanji} — ${current.hira}</div><p class="meaning">Nghĩa tiếng Việt: ${current.meaning}</p>`; $('#score').textContent=`${right} / ${total}`; }
function restart(){ right=0; total=0; $('#score').textContent='0 / 0'; setPool(); }
for(const n of [...new Set(words.map(w=>w.unit))]) unit.add(new Option(`Unit ${n}`,n)); unit.add(new Option('Tất cả Unit','all')); unit.value='all'; unit.onchange=setPool; $('#shuffle').onclick=setPool; $('#restart').onclick=restart; $('#next').onclick=next;
document.addEventListener('keydown',e=>{if(e.key==='Enter'){next();return}const n=Number(e.key);if(n>=1&&n<=4&&!answered)options.children[n-1]?.click()}); setPool();
</script>
